<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 160 2100 1450">
  <defs>
    <!-- Soft Tactile 3D Shadow Filter in #635BFF -->
    <filter id="graphic-soft-tactile" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="ambientBlur" />
      <feOffset in="ambientBlur" dx="0" dy="16" result="ambientOffset" />
      <feFlood flood-color="#635BFF" flood-opacity="0.25" result="ambientColor" />
      <feComposite in="ambientColor" in2="ambientOffset" operator="in" result="ambientShadow" />

      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="softGraphic" />

      <feMerge>
        <feMergeNode in="ambientShadow" />
        <feMergeNode in="softGraphic" />
      </feMerge>
    </filter>

    <!-- Signature #635BFF Diagonal Ribbon Gradient (Left Wing) -->
    <linearGradient id="relay-purple-left" x1="0%" y1="100%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5248FF"/>
      <stop offset="40%" stop-color="#635BFF"/>
      <stop offset="80%" stop-color="#7C75FF"/>
      <stop offset="100%" stop-color="#938DFF"/>
    </linearGradient>

    <!-- Signature #635BFF 3D Ribbon Gradient (Right Wing) -->
    <linearGradient id="relay-purple-right" x1="1050" y1="500" x2="1570" y2="1600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C75FF"/>
      <stop offset="35%" stop-color="#635BFF"/>
      <stop offset="75%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Top Fold Cap Highlight Gradient in #635BFF -->
    <linearGradient id="relay-purple-cap" x1="1050" y1="300" x2="1570" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5A0FF"/>
      <stop offset="50%" stop-color="#837CFF"/>
      <stop offset="100%" stop-color="#635BFF"/>
    </linearGradient>

    <!-- 3D Sphere Radial Gradient for Brand Circle Dot in #635BFF -->
    <radialGradient id="relay-purple-dot" cx="35%" cy="30%" r="70%" fx="25%" fy="20%">
      <stop offset="0%" stop-color="#A5A0FF"/>
      <stop offset="35%" stop-color="#7C75FF"/>
      <stop offset="70%" stop-color="#635BFF"/>
      <stop offset="90%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </radialGradient>
  </defs>

  <g id="ribbon-graphic" filter="url(#graphic-soft-tactile)">
    <!-- 1. Right Brand Circle (Dot) - Positioned behind/beside the top right wing -->
    <circle 
      cx="1860" 
      cy="912" 
      r="205" 
      fill="url(#relay-purple-dot)"
    />

    <!-- 2. Left Diagonal Band with 3D Gloss Curve -->
    <path 
      d="M133.61,970.29s-127.94,103.57,0,119.41c127.94,15.84,378.96,47.52,378.96,47.52,0,0,68.5,6.05,137.55-62.23,9.11-9.01,62.06-59.44,69.89-66.74l758.69-707.26s26.3-21.04,53.92,3.08c0,0-20.24-45.45-76.36-55.15-47.45-8.2-323.8-58.52-407.97-73.85-27.9-5.08-56.65-4.24-83.99,3.28-18.59,5.11-38.01,13.59-52.56,27.62L133.61,970.29Z" 
      fill="url(#relay-purple-left)"
    />

    <!-- 3. Right Vertical Band with Depth -->
    <path 
      d="M1050.7,698.54l-1.06,700.51c0,5.64-.13,11.29-.27,16.93-.38,14.95,2.19,62.06,49.14,69.56,55.93,8.93,192.38-3,280.55-63.01,55.11-37.51,91.01-72.62,118.81-112.49,31.74-45.54,52.41-97.79,62.12-152.45,3.98-22.42,7.02-47.9,7.02-73.4v-73.81l-502.95-296.79c-3.82-2.25-7.24-5.16-9.9-8.7-1.44-1.91-2.74-4.09-3.44-6.34Z" 
      fill="url(#relay-purple-right)"
    />

    <!-- 4. Top Fold Cap Highlight for 3D Volume -->
    <path 
      d="M1052.79,698.54l427.02-398.19s.42-.39.66-.56c3.55-2.47,30.34-19.86,54.72,4.82,10.7,10.87,18.09,24.37,23.01,36.48,6.17,15.1,9.15,31.39,9.2,47.7l1.66,620.31c0,2.16-2.39,3.56-4.27,2.44l-503.9-297.68c-.68-.4-.132-.88-1.94-1.4-.6-.49-1.39-.99-1.96-1.55l-6-4.94c-2.78-2.33-2.88-6.55-.3-8.99Z" 
      fill="url(#relay-purple-cap)"
      opacity="0.96"
    />
  </g>
</svg>